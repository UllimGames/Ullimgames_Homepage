<!DOCTYPE html>
<html lang="ko" data-title-en="Fruit Volley | Ullim Games">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/i18n-boot.js?v=1"></script>
    <title>후르츠발리 | 울림게임즈</title>
    <meta name="description" content="울림게임즈의 캐주얼 발리볼 게임 후르츠발리. 설치 없이 브라우저에서 바로 플레이하세요.">
    <link rel="canonical" href="https://ullimgames.com/play/fruit-valley/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="울림게임즈">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:url" content="https://ullimgames.com/play/fruit-valley/">
    <meta property="og:title" content="후르츠발리 | 울림게임즈">
    <meta property="og:description" content="설치 없이 브라우저에서 바로 하는 캐주얼 발리볼.">
    <meta property="og:image" content="https://ullimgames.com/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico?v=clear1" sizes="48x48">
    <link rel="icon" href="/images/favicon.png?v=clear1" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=clear1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body class="play-page">

<header class="play-header">
    <div class="play-header-inner">
        <a class="play-back" href="/" data-en="← Home">← 홈으로</a>
        <div class="play-title-wrap">
            <img src="/images/ullimgames_logo.png" alt="울림게임즈" data-en-alt="Ullim Games" class="play-logo">
            <h1 class="play-title" data-en="Fruit Volley">후르츠발리</h1>
        </div>
        <button class="lang-toggle" id="langToggle" type="button" aria-label="언어 변경: English로 보기" data-en-aria-label="Change language: view in Korean">
            <svg class="lang-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9M12 3C9.4 5.6 8.1 8.6 8.1 12s1.3 6.4 3.9 9"/></svg>
            <span class="lang-code" data-lang-code="ko">KO</span><span class="lang-sep" aria-hidden="true">/</span><span class="lang-code" data-lang-code="en">EN</span>
        </button>
    </div>
</header>

<main class="play-main">
    <section class="play-stage" aria-label="후르츠발리 게임 화면" data-en-aria-label="Fruit Volley game screen">
        <div class="play-frame-wrap">
            <!-- Unity WebGL build lives in /games/fruit-valley/ (drop-in replace) -->
            <iframe
                id="fruitValleyFrame"
                class="play-frame"
                src="/games/fruit-valley/?v=20260723c"
                title="후르츠발리 WebGL"
                allow="fullscreen; autoplay; gamepad; clipboard-write"
            ></iframe>
        </div>
    </section>

    <!-- Ranking UI ready; data wiring stays OFF until server exists (data-ranking-enabled). -->
    <aside class="play-ranking" aria-label="후르츠발리 랭킹" data-en-aria-label="Fruit Volley ranking" data-ranking-enabled="false">
        <div class="play-ranking-head">
            <p class="play-ranking-kicker">FRUIT VOLLEY</p>
            <h2 class="play-ranking-title" data-en="Ranking">랭킹</h2>
        </div>

        <div class="play-ranking-cols" aria-hidden="true">
            <span data-en="Rank">순위</span>
            <span data-en="Player">닉네임</span>
            <span data-en="Score">점수</span>
        </div>

        <ol class="play-ranking-list" id="fruitValleyRankingList">
            <!-- Rows filled by JS (empty placeholders until server ranking is enabled) -->
        </ol>
    </aside>
</main>

<script>
    (function () {
        var RANK_LIMIT = 10;
        var listEl = document.getElementById('fruitValleyRankingList');
        var boardEl = document.querySelector('.play-ranking');

        function renderRows(entries) {
            if (!listEl) return;
            var html = '';
            for (var i = 0; i < RANK_LIMIT; i++) {
                var entry = entries[i];
                var rank = i + 1;
                var name = entry && entry.name ? entry.name : '—';
                var score = entry && typeof entry.score === 'number' ? entry.score.toLocaleString('ko-KR') : '—';
                var medal = rank === 1 ? ' is-gold' : rank === 2 ? ' is-silver' : rank === 3 ? ' is-bronze' : '';
                html +=
                    '<li class="play-ranking-row' + medal + '">' +
                    '<span class="play-ranking-rank">' + rank + '</span>' +
                    '<span class="play-ranking-name">' + name + '</span>' +
                    '<span class="play-ranking-score">' + score + '</span>' +
                    '</li>';
            }
            listEl.innerHTML = html;
        }

        // Empty board for now (ranking storage OFF)
        renderRows([]);

        window.UllimFruitValleyRanking = {
            enabled: false,
            render: renderRows,
            submitScore: function () {
                console.info('[Ullim] Ranking is disabled. Wire server later, then set enabled = true.');
                return Promise.resolve({ ok: false, reason: 'disabled' });
            },
            setEnabled: function (on) {
                this.enabled = !!on;
                if (boardEl) boardEl.setAttribute('data-ranking-enabled', on ? 'true' : 'false');
            }
        };
    })();
</script>
<script src="/js/i18n.js?v=1"></script>
</body>
</html>
