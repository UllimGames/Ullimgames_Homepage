    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico?v=clear1" sizes="48x48">

</head>
<body class="play-page">
<script src="/js/theme-catalog.js?v=4"></script>
<script src="/js/theme-schedule.js?v=4"></script>
<script src="/js/theme.js?v=5"></script>

<header class="play-header">
    <div class="play-header-inner">
        <a class="play-back" href="/play/" aria-label="플레이 공간으로" data-en-aria-label="Back to Play Zone">
            <span aria-hidden="true">←</span>
            <span class="play-back-label" data-en="Play Zone">플레이 공간</span>
        </a>
        <a class="play-home" href="/" aria-label="울림게임즈 홈" data-en-aria-label="Ullim Games home">
            <img src="/images/ullimgames_logo.png" alt="" class="play-logo" width="185" height="204">
        </a>
        <button class="lang-toggle" id="langToggle" type="button" aria-label="언어 변경: English로 보기" data-en-aria-label="Change language: view in Korean">
            <svg class="lang-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9M12 3C9.4 5.6 8.1 8.6 8.1 12s1.3 6.4 3.9 9"/></svg>
            <span class="lang-code" data-lang-code="ko">KO</span><span class="lang-sep" aria-hidden="true">/</span><span class="lang-code" data-lang-code="en">EN</span>
        </button>
    </div>
</header>

<!-- Game shape: data-orientation="portrait" (9:16) or "landscape" (16:9). -->
<main class="pf pv site-skin" data-orientation="portrait">
    <div class="pv-layout">
        <section class="pv-info" aria-labelledby="pvTitle">
            <p class="pv-kicker">WEB GAME</p>
            <span class="pf-badge" data-en="Event entry">이벤트 참가작</span>
            <h1 class="pv-title" id="pvTitle" data-en="Fruit Volley">후르츠발리</h1>
            <p class="pv-copy" data-en="A casual volleyball game full of summer vibes. Play it right here, no install needed.">여름 감성의 캐주얼 발리볼. 설치 없이 이 화면에서 바로 즐길 수 있습니다.</p>
            <ul class="device-list" aria-label="플레이 가능 기기" data-en-aria-label="Playable on">
                <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg><span data-en="Mobile">모바일</span></li>
                <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.8"/><path d="M9 20h6M12 16v4"/></svg><span>PC</span></li>
            </ul>
            <ul class="pf-tags" aria-label="기술 태그" data-en-aria-label="Tech tags">
                <li>#Unity</li><li>#WebGL</li>
            </ul>
            <div class="pv-actions">
                <button class="pv-btn is-primary" id="pvFullscreen" type="button" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                    <span data-en="Full screen">전체화면</span>
                </button>
                <a class="pv-btn" href="/play/">
                    <span data-en="More web games">다른 웹게임</span>
                    <span aria-hidden="true">→</span>
                </a>
            </div>
            <p class="pv-note" data-en="The first load can take a few seconds.">처음 불러올 때 몇 초 걸릴 수 있습니다.</p>
        </section>

        <section class="pv-stage" aria-label="후르츠발리 게임 화면" data-en-aria-label="Fruit Volley game screen">
            <div class="play-frame-wrap" id="pvFrameWrap">
                <!-- Unity WebGL build lives in /games/fruit-valley/ (drop-in replace) -->
                <iframe
                    id="fruitValleyFrame"
                    class="play-frame"
                    src="/games/fruit-valley/?v=20260723c"
                    title="후르츠발리 WebGL"
                    allow="fullscreen; autoplay; gamepad; clipboard-write"
                    allowfullscreen
                ></iframe>
            </div>
        </section>
    </div>
</main>

<script>
    (function () {
        // Full screen: only shown where the browser supports it (not on iPhone Safari).
        var fsBtn = document.getElementById('pvFullscreen');
        var wrap = document.getElementById('pvFrameWrap');
        if (fsBtn && wrap && wrap.requestFullscreen) {
            fsBtn.hidden = false;
            fsBtn.addEventListener('click', function () {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    wrap.requestFullscreen().catch(function () {});
                }
            });
        }
    })();
</script>
<script src="/js/i18n.js?v=1"></script>
</body>
</html>
