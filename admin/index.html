<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테마 관리 | 울림게임즈</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=clear1" sizes="48x48">
    <link rel="icon" href="/images/favicon.png?v=clear1" type="image/png" sizes="192x192">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
    <link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
<script src="/js/theme-catalog.js?v=4"></script>
<script src="/js/theme-schedule.js?v=4"></script>
<script src="/js/admin-lock.js"></script>
<script src="/js/theme.js?v=5"></script>

<main class="admin-main">
    <section id="adminGate" class="admin-card">
        <h1>관리</h1>
        <p id="gateCopy" class="admin-note">비밀번호를 입력하세요.</p>
        <form id="gateForm">
            <label class="admin-label" for="adminPass">비밀번호</label>
            <input id="adminPass" class="admin-input" type="password" autocomplete="current-password" required>
            <button class="admin-button" type="submit">들어가기</button>
        </form>
        <p><a href="/">홈으로</a></p>
    </section>

    <section id="adminPanel" class="admin-card" hidden>
        <h1>달별 테마</h1>
        <p id="adminStatus" class="admin-note" role="status"></p>

        <form id="themeForm">
            <p class="admin-note">홈페이지 테마는 항상 이 달력대로, 매달 1일에 자동으로 바뀝니다.</p>

            <div id="monthList" class="admin-months"></div>

            <div class="admin-actions">
                <button class="admin-button" type="submit">파일에 저장</button>
                <button class="admin-button admin-button--quiet" id="logoutBtn" type="button">나가기</button>
            </div>
        </form>

        <h2 class="admin-subtitle">테마 미리보기</h2>
        <p class="admin-note">누르면 이 화면의 배경과 떨어지는 효과가 바로 바뀝니다. 저장되지 않으며 홈페이지에는 영향이 없습니다.</p>
        <div id="previewList" class="admin-preview-list"></div>

        <p><a href="/">홈으로</a></p>
    </section>
</main>

<script>
(function () {
    "use strict";

    var CATALOG = window.UllimThemeCatalog || {};
    var NAMES = Object.keys(CATALOG);
    var SESSION_KEY = "ullim-admin-session";
    var gate = document.getElementById("adminGate");
    var panel = document.getElementById("adminPanel");
    var gateCopy = document.getElementById("gateCopy");
    var gateForm = document.getElementById("gateForm");
    var monthList = document.getElementById("monthList");
    var status = document.getElementById("adminStatus");

    function label(name) {
        return CATALOG[name] ? CATALOG[name].label : name;
    }

    function hashText(text) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
            return Array.from(new Uint8Array(buf)).map(function (n) {
                return n.toString(16).padStart(2, "0");
            }).join("");
        });
    }

    function option(value, text) {
        var el = document.createElement("option");
        el.value = value;
        el.textContent = text;
        return el;
    }

    function fillForm(schedule) {
        monthList.innerHTML = "";
        for (var month = 1; month <= 12; month++) {
            var row = document.createElement("label");
            row.className = "admin-month";
            var name = document.createElement("span");
            name.textContent = month + "월";
            var select = document.createElement("select");
            select.className = "admin-input";
            select.dataset.month = String(month);
            NAMES.forEach(function (theme) {
                select.appendChild(option(theme, label(theme)));
            });
            select.value = (schedule.months && schedule.months[String(month)]) || NAMES[0];
            row.appendChild(name);
            row.appendChild(select);
            monthList.appendChild(row);
        }
    }

    function fillPreviews() {
        var list = document.getElementById("previewList");
        NAMES.forEach(function (name) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "admin-button admin-button--quiet";
            btn.textContent = label(name);
            btn.setAttribute("aria-pressed", String(name === window.UllimTheme.current));
            btn.addEventListener("click", function () {
                window.UllimTheme.show(name);
                list.querySelectorAll("button").forEach(function (b) {
                    b.setAttribute("aria-pressed", String(b === btn));
                });
            });
            list.appendChild(btn);
        });
    }

    function readForm() {
        var months = {};
        monthList.querySelectorAll("select").forEach(function (select) {
            months[select.dataset.month] = select.value;
        });
        return { months: months };
    }

    function describeNow() {
        var month = new Date().getMonth() + 1;
        var now = window.UllimTheme ? window.UllimTheme.scheduledTheme() : "";
        status.textContent = "지금은 " + month + "월이라 '" + label(now) + "' 테마가 홈페이지에 나갑니다.";
    }

    function showPanel() {
        gate.hidden = true;
        panel.hidden = false;
        fillForm(window.UllimThemeSchedule || { months: {} });
        fillPreviews();
        describeNow();
    }

    if (!window.UllimAdminLock) {
        gateCopy.textContent = "비밀번호가 아직 설정되지 않았습니다.";
        gateForm.hidden = true;
    } else if (sessionStorage.getItem(SESSION_KEY) === "ok") {
        showPanel();
    }

    gateForm.addEventListener("submit", function (event) {
        event.preventDefault();
        hashText(document.getElementById("adminPass").value).then(function (hash) {
            if (hash !== window.UllimAdminLock) {
                gateCopy.textContent = "비밀번호가 다릅니다.";
                return;
            }
            sessionStorage.setItem(SESSION_KEY, "ok");
            showPanel();
        });
    });

    document.getElementById("themeForm").addEventListener("submit", function (event) {
        event.preventDefault();
        status.textContent = "저장하는 중...";
        fetch("/api/theme-schedule", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(readForm())
        }).then(function (res) {
            if (!res.ok) throw new Error("save failed");
            status.textContent = "js/theme-schedule.js 파일에 저장했습니다. GitHub에 올리면(커밋·푸시) 공개 홈페이지에 반영됩니다.";
        }).catch(function () {
            status.textContent = "저장하지 못했습니다. 저장은 이 컴퓨터에서 'python tools/dev_server.py'로 연 관리 페이지에서만 됩니다. (공개 홈페이지에서는 저장 기능이 없습니다.)";
        });
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
        sessionStorage.removeItem(SESSION_KEY);
        location.href = "/";
    });
})();
</script>
</body>
</html>
